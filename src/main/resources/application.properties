spring.application.name=Baffang

# ???????
server.port=8080

# 文件上传配置
# 上传文件存储路径
file.upload.path=${user.dir}/files/common

file.upload.url-prefix=http://localhost:8080/files
# 单个文件最大大小
spring.servlet.multipart.max-file-size=10MB
# 单次请求最大大小
spring.servlet.multipart.max-request-size=100MB

# MySQL???????
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/baffang?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# MyBatis??
mybatis.mapper-locations=classpath*:com/baffang/**/mapper/*.xml
mybatis.type-aliases-package=com.baffang.common.entity
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.call-setters-on-nulls=true

#Ai
spring.ai.openai.api-key=${DEEPSEEK_API_KEY:}
spring.ai.openai.base-url=https://api.deepseek.com

spring.ai.openai.chat.options.model=deepseek-chat
spring.ai.openai.chat.options.temperature=1


# 高德地图配置
amap.api-key=${AMAP_API_KEY:}
amap.base-url=https://restapi.amap.com/v3
amap.geocode-path=/geocode/geo
amap.regeocode-path=/geocode/regeo
amap.direction-path=/direction/driving
amap.ip-locate-path=/ip
amap.weather-path=/weather/weatherInfo
amap.sig-key=
amap.output=JSON
amap.api.key=${AMAP_API_KEY:}
amap.api.url.poi-search=https://restapi.amap.com/v3/place/text
amap.search.default-radius=5000
amap.search.max-radius=20000
amap.search.default-page-size=20
amap.search.keywords=\u5145\u7535\u7ad9

# 设置Spring Boot应用程序的默认时区为北京时间
spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# 设置JVM默认时区
spring.main.web-application-type=servlet
spring.application.admin.enabled=false

# application.yml
deepseek.api.key=${DEEPSEEK_API_KEY:}
deepseek.api.url=https://api.deepseek.com/v1/chat/completions
deepseek.api.model=deepseek-chat
deepseek.api.timeout=120

# JWT 签名密钥（安全整改：不再硬编码在代码中，由 JwtKeyConfig 启动时校验注入）
jwt.secret=${JWT_SECRET:}

# 短信验证码校验开关（安全整改：默认真校验；仅本地演示可置 false 退回"非空即通过"旧行为）
verification.code.enabled=${VERIFICATION_CODE_ENABLED:true}

# ── 支付宝沙箱支付（真实可运营整改：手写 RSA2 协议，无 SDK）──
# 沙箱开通：支付宝开放平台 → 沙箱环境，生成 RSA2 密钥对，公钥上传沙箱应用，私钥填入下方
pay.alipay.enabled=${ALIPAY_ENABLED:false}
pay.alipay.app-id=${ALIPAY_APP_ID:}
pay.alipay.private-key=${ALIPAY_PRIVATE_KEY:}
pay.alipay.alipay-public-key=${ALIPAY_PUBLIC_KEY:}
pay.alipay.gateway-url=${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
pay.alipay.notify-url=${ALIPAY_NOTIFY_URL:}
pay.alipay.return-url=${ALIPAY_RETURN_URL:}

# ── 可观测性（真实可运营整改）──
# 日志带 traceId（TraceIdFilter 写入 MDC），报障凭 X-Trace-Id 响应头即可检索全链路日志
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-}]
# actuator：与应用同端口，走统一安全链——prometheus 端点需管理员凭据（防指标泄漏）
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized

# ── 短信触达（默认本地模拟仅记日志；配 aliyun + 密钥即真实发送）──
sms.provider=${SMS_PROVIDER:none}
sms.aliyun.access-key-id=${ALIYUN_SMS_ACCESS_KEY_ID:}
sms.aliyun.access-key-secret=${ALIYUN_SMS_ACCESS_KEY_SECRET:}
sms.aliyun.sign-name=${ALIYUN_SMS_SIGN_NAME:}
sms.aliyun.template-code=${ALIYUN_SMS_TEMPLATE_CODE:}

